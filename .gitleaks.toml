[extend]
useDefault = true

[allowlist]
description = "Excluye fixtures y datos de ejemplo intencionales del proyecto original OWASP Juice Shop (contraseñas/tokens/claves de prueba publicas del propio repo, usadas en sus tests y challenges educativos, no secretos reales introducidos por este fork)"
paths = [
  '''^test/''',
  '''^frontend/src/app/.*\.spec\.ts$''',
  '''^frontend/src/app/faucet/faucet\.component\.ts$''',
  '''^data/static/users\.yml$''',
  '''^lib/insecurity\.ts$''',
  '''^routes/login\.ts$''',
  '''terraform/networking\.tf$'''
]
