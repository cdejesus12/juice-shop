name: DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  scan:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Secret Scanning - Gitleaks
        id: gitleaks
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          docker run --rm -v "$(pwd)":/repo -v "$RUNNER_TEMP/gitleaks":/reports \
            zricethezav/gitleaks:v8.21.2 detect \
            --source="/repo" \
            --report-path=/reports/gitleaks-report.json \
            --exit-code=1

      - name: SAST - SonarQube
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000

      - name: Quality Gate check
        id: quality_gate
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SCA - Trivy filesystem scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: DAST - OWASP ZAP baseline scan
        id: zap
        continue-on-error: true
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run --rm -v "$(pwd)":/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:3000 \
            -c .zap/rules.tsv \
            -J report_json.json -w report_md.md -r report_html.html -I

      - name: Evaluate overall pipeline result
        if: always()
        run: |
          echo "Gitleaks:     ${{ steps.gitleaks.outcome }}"
          echo "Quality Gate: ${{ steps.quality_gate.outcome }}"
          echo "Trivy:        ${{ steps.trivy.outcome }}"
          echo "ZAP:          ${{ steps.zap.outcome }}"
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ] || [ "${{ steps.quality_gate.outcome }}" = "failure" ] || [ "${{ steps.trivy.outcome }}" = "failure" ] || [ "${{ steps.zap.outcome }}" = "failure" ]; then
            echo "❌ Uno o más escaneos de seguridad encontraron hallazgos que bloquean el pipeline."
            exit 1
          fi
          echo "✅ Todos los escaneos pasaron sin hallazgos bloqueantes."
